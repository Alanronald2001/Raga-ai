<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raga — Offline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #334155;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
      }
      svg {
        color: #4f46e5;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
      }
      p {
        font-size: 0.95rem;
        color: #64748b;
        max-width: 320px;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.6rem 1.5rem;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <svg
      width="48"
      height="48"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374
             1.948 3.374h14.71c1.73 0 2.813-1.874
             1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898
             0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"
      />
    </svg>
    <h1>You're offline</h1>
    <p>HealthOS can't reach the server right now. Check your connection and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </body>
</html>
